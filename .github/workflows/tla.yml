name: tla

on:
  pull_request:
    paths: ["tla/**", ".github/workflows/tla.yml"]
  push:
    branches: [main]
    paths: ["tla/**", ".github/workflows/tla.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch TLC
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum -c -
      - name: Mutants
        run: python3 tla/mutants.py "$RUNNER_TEMP/tla2tools.jar"
