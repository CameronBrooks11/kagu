# Claude Code through claude-agent-acp, confined by bwrap and Landlock.
#
# The sandbox's PATH is /usr/local/bin:/usr/bin:/bin, so the command must
# reach Node by absolute path: a wrapper that execs it, or
# command = ["/path/to/node", "/path/to/claude-agent-acp/dist/index.js"].
# An npm shim starting `#!/usr/bin/env node` finds no node there.
#
# Copy to ~/.config/kagu/profiles/claude.toml, set the `ro` paths to where
# the adapter and its Node runtime are installed, then sign in once:
#
#   kagu auth claude
#
# and run work with `kagu run --profile claude --workspace <dir> --prompt ...`.
version = 1

[worker]
command = ["claude-agent-acp"]
# Claude Code keeps its login and transcripts here: the profile's own home.
home_env = ["CLAUDE_CONFIG_DIR"]

# Claude Code loads no settings file: not the home's, not ~/.claude, not the
# workspace's .claude/ (spec: Harness home).
[worker.meta.claudeCode.options]
settingSources = []

# The adapter itself reads the home's settings.json whatever settingSources
# says, so kagu pins it: read-only from kagu's own copy under bwrap. Mode
# "default" sends every tool call to kagu as a permission request, which kagu
# answers and records; without it the adapter starts in "auto", where Claude
# Code approves tool calls itself.
[worker.home_files]
"settings.json" = '{"permissions":{"defaultMode":"default"}}'

[grant]
substrate = "bwrap"
network = "host"
# Host-wide Claude Code policy would override the profile, and a sandbox it
# turns on cannot start inside kagu's. kagu's sandbox is the boundary.
hide = ["/etc/claude-code"]
ro = [
  "/home/YOU/.local/share/fnm",                # Node
  "/home/YOU/.local/lib/claude-agent-acp",     # the adapter and Claude Code
]
