repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Clippy is slow, so it stays in `just check` and CI
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      # Trial records are public: no identifier, secret or edited log
      - id: bench-check
        name: bench files are safe to commit
        entry: python3 bench/tools/bench.py check
        language: system
        files: ^bench/
        # Symlinks too, which the default `types: [file]` would skip: git
        # commits a link's target path
        types: []
        types_or: [file, symlink]
